<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>博客 · 黄梓颖</title>
  <link rel="icon" type="image/jpeg" href="图片/头像.jpeg">
  <link rel="apple-touch-icon" href="图片/头像.jpeg">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <script>
    /* 主题初始化：必须先于样式生效，避免页面切换时闪白 */
    (function () {
      try {
        var 存 = localStorage.getItem("站点主题");
        var 系统 = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var 主题 = 存 === "light" || 存 === "dark" ? 存 : (系统 ? "dark" : "light");
        document.documentElement.setAttribute("data-主题", 主题);
      } catch (e) {
        document.documentElement.setAttribute("data-主题", "light");
      }
    })();
  </script>
  <style>
    :root {
      --色-墨:        #1d1d1f;
      --色-墨次:      #424245;
      --色-灰深:      #6e6e73;
      --色-灰中:      #86868b;
      --色-灰浅:      #d2d2d7;
      --色-灰极浅:    #f5f5f7;
      --色-纸:        #ffffff;
      --色-蓝:        #0071e3;
      --色-蓝深:      #0077ed;
      --色-导航底:    rgba(255, 255, 255, 0.72);
      --色-导航底色:  rgba(0, 0, 0, 0.06);
      --字体-中文:
        -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      --过渡: cubic-bezier(0.28, 0.18, 0.26, 1.01);
    }

    :root[data-主题="dark"] {
      --色-墨:        #f5f5f7;
      --色-墨次:      #c8c8cd;
      --色-灰深:      #98989d;
      --色-灰中:      #86868b;
      --色-灰浅:      #3a3a3c;
      --色-灰极浅:    #2a2a2c;
      --色-纸:        #000000;
      --色-蓝:        #0a84ff;
      --色-蓝深:      #409cff;
      --色-导航底:    rgba(0, 0, 0, 0.72);
      --色-导航底色:  rgba(255, 255, 255, 0.1);
    }

    html { color-scheme: light; }
    html[data-主题="dark"] { color-scheme: dark; }
    html, body { transition: background-color 0.3s var(--过渡), color 0.3s var(--过渡); }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      font-family: var(--字体-中文);
      font-size: 17px;
      line-height: 1.7;
      color: var(--色-墨);
      background: var(--色-纸);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.003em;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 1.75rem auto;
      border-radius: 8px;
    }

    a {
      color: var(--色-蓝);
      text-decoration: none;
      transition: color 0.18s var(--过渡);
    }
    a:hover { color: var(--色-蓝深); }

    #顶部导航 {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 14px 24px;
      background: var(--色-导航底);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s var(--过渡), background-color 0.3s var(--过渡);
      font-size: 14px;
    }
    #顶部导航.已滚动 { border-bottom-color: var(--色-导航底色); }
    #顶部导航 a {
      color: var(--色-墨);
      transition: color 0.18s var(--过渡);
    }
    #顶部导航 a:hover { color: var(--色-蓝); }

    main {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 6.5rem 24px 6rem;
    }

    #博客头 {
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--色-灰浅);
      opacity: 0;
      transform: translateY(12px);
      animation: 淡入 0.7s var(--过渡) 0.05s forwards;
    }
    #博客标题 {
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--色-墨);
      margin: 0 0 0.6rem;
    }
    #博客日期 {
      color: var(--色-灰深);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    #博客正文 {
      font-size: 18px;
      line-height: 1.75;
      color: var(--色-墨次);
      letter-spacing: -0.005em;
      opacity: 0;
      transform: translateY(12px);
      animation: 淡入 0.7s var(--过渡) 0.15s forwards;
    }
    #博客正文 h1, #博客正文 h2, #博客正文 h3 {
      font-family: var(--字体-中文);
      color: var(--色-墨);
      letter-spacing: -0.018em;
      margin: 2.5rem 0 1rem;
      line-height: 1.3;
    }
    #博客正文 h1 { font-size: 28px; font-weight: 600; }
    #博客正文 h2 { font-size: 24px; font-weight: 600; }
    #博客正文 h3 { font-size: 20px; font-weight: 600; }
    #博客正文 p { margin: 0 0 1.5rem; }
    #博客正文 ul, #博客正文 ol { padding-left: 1.5rem; margin: 0 0 1.5rem; }
    #博客正文 li { margin-bottom: 0.5rem; }
    #博客正文 strong { color: var(--色-墨); font-weight: 600; }
    #博客正文 blockquote {
      margin: 1.75rem 0;
      padding: 0.5rem 0 0.5rem 1.25rem;
      border-left: 3px solid var(--色-灰浅);
      color: var(--色-灰深);
    }
    #博客正文 blockquote p { margin-bottom: 0.5rem; }
    #博客正文 blockquote p:last-child { margin-bottom: 0; }
    #博客正文 code {
      background: var(--色-灰极浅);
      padding: 0.15em 0.45em;
      border-radius: 4px;
      font-size: 0.9em;
      font-family: "SF Mono", Menlo, Consolas, monospace;
    }
    #博客正文 pre {
      background: var(--色-灰极浅);
      padding: 1.25rem;
      border-radius: 10px;
      overflow-x: auto;
      margin: 1.75rem 0;
    }
    #博客正文 pre code { background: transparent; padding: 0; font-size: 14px; }
    #博客正文 hr {
      border: none;
      border-top: 1px solid var(--色-灰浅);
      margin: 2.5rem 0;
    }
    #博客正文 table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.75rem 0;
      font-size: 15px;
    }
    #博客正文 th, #博客正文 td {
      padding: 0.6rem 0.85rem;
      text-align: left;
      border-bottom: 1px solid var(--色-灰浅);
    }
    #博客正文 th {
      font-weight: 600;
      color: var(--色-墨);
      background: var(--色-灰极浅);
    }

    #错误提示 {
      color: var(--色-墨次);
      background: var(--色-灰极浅);
      padding: 1.25rem 1.5rem;
      border-radius: 10px;
      margin: 2rem 0;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    #返回主页 {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 4rem;
      color: var(--色-蓝);
      font-size: 15px;
      transition: gap 0.18s var(--过渡);
    }
    #返回主页:hover { gap: 8px; color: var(--色-蓝深); }

    @keyframes 淡入 {
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      #博客头, #博客正文 { opacity: 1; transform: none; animation: none; }
    }

    @media (max-width: 600px) {
      body { font-size: 16px; }
      main { padding: 5.5rem 20px 4rem; }
      #博客正文 { font-size: 17px; }
      #博客正文 h1 { font-size: 24px; }
      #博客正文 h2 { font-size: 21px; }
      #博客正文 h3 { font-size: 18px; }
    }
  </style>
</head>
<body>

<header id="顶部导航">
  <a id="返回链接" href="index.html">‹ 黄梓颖</a>
</header>

<main>
  <article>
    <header id="博客头">
      <h1 id="博客标题">加载中…</h1>
      <div id="博客日期"></div>
    </header>
    <div id="博客正文"></div>
  </article>

  <a id="返回主页" href="index.html">‹ 返回主页</a>
</main>

<script src="内容配置.js"></script>
<script src="博客索引.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  /* ===== 语言：从 URL ?lang=, 否则 localStorage, 否则默认 zh ===== */
  function 取语言() {
    const q = new URLSearchParams(window.location.search).get("lang");
    if (q === "zh" || q === "en") return q;
    try {
      const s = localStorage.getItem("站点语言");
      if (s === "zh" || s === "en") return s;
    } catch (e) {}
    return "zh";
  }
  const 当前语言 = 取语言();

  const 文案 = {
    zh: {
      返回: (名) => "‹ " + 名,
      返回主页: "‹ 返回主页",
      标题后缀: " · 黄梓颖",
      默认作者: "黄梓颖",
      无标题: "无标题",
      未找到: (n) => "没有在博客索引里找到这篇文章：" + n,
      缺参数: "缺少博客文件名参数。请从主页博客列表点击进入。",
      加载失败: (m) =>
        "加载博客正文失败：" + m +
        "\n\n如果你是用浏览器双击 .html 直接打开（地址栏是 file://），fetch 会被浏览器拦截。请把网站推到 GitHub Pages 后再访问，或本地用 VS Code 的 Live Server 插件预览。",
      解析库未加载: "markdown 解析库未加载，请检查网络连接",
      无法加载: "无法加载",
    },
    en: {
      返回: (名) => "‹ " + 名,
      返回主页: "‹ Back to home",
      标题后缀: " · Ziying Huang",
      默认作者: "Ziying Huang",
      无标题: "Untitled",
      未找到: (n) => "Post not found in blog index: " + n,
      缺参数: "Missing blog file parameter. Please open from the blog list on the home page.",
      加载失败: (m) =>
        "Failed to load post: " + m +
        "\n\nIf you opened this .html by double-clicking (file:// in the address bar), fetch is blocked by the browser. Push the site to GitHub Pages or use VS Code Live Server for local preview.",
      解析库未加载: "Markdown parser failed to load, please check your network",
      无法加载: "Failed to load",
    },
  }[当前语言];

  document.documentElement.lang = 当前语言 === "zh" ? "zh-CN" : "en";

  /* 首屏 title 同步当前语言，避免英文用户进来先闪一下中文 */
  if (当前语言 === "en") {
    document.title = "Blog · Ziying Huang";
  }

  /* 顶部「‹ 名字」 + 「返回主页」 文案 */
  const 内容 = window.内容 || {};
  function 取本地化(值) {
    if (值 == null) return "";
    if (typeof 值 === "string") return 值;
    return 值[当前语言] || 值.zh || 值.en || "";
  }
  const 名字 = 取本地化(内容.名字) || 文案.默认作者;
  document.getElementById("返回链接").textContent = 文案.返回(名字);
  document.getElementById("返回链接").href = "index.html";
  document.getElementById("返回主页").textContent = 文案.返回主页;

  (async function 渲染博客() {
    const 博客索引 = window.博客索引 || [];
    const 参数 = new URLSearchParams(window.location.search);
    const 文件名 = 参数.get("文件");

    const 标题节点 = document.getElementById("博客标题");
    const 日期节点 = document.getElementById("博客日期");
    const 正文节点 = document.getElementById("博客正文");

    if (!文件名) {
      展示错误(文案.缺参数);
      return;
    }

    const 元信息 = 博客索引.find(b => b.文件名 === 文件名);
    if (!元信息) {
      展示错误(文案.未找到(文件名));
      return;
    }

    document.title = (元信息.标题 || "") + 文案.标题后缀;
    标题节点.textContent = 元信息.标题 || 文案.无标题;
    日期节点.textContent = 元信息.日期 || "";

    try {
      const 响应 = await fetch("博客/" + encodeURIComponent(文件名) + ".md");
      if (!响应.ok) throw new Error("HTTP " + 响应.status);
      const 文本 = await 响应.text();

      if (typeof window.marked === "undefined") {
        throw new Error(文案.解析库未加载);
      }

      window.marked.setOptions({ breaks: true, gfm: true });
      正文节点.innerHTML = window.marked.parse(文本);
    } catch (错误) {
      展示错误(文案.加载失败(错误.message));
    }

    function 展示错误(消息) {
      标题节点.textContent = 文案.无法加载;
      日期节点.textContent = "";
      正文节点.innerHTML = "";
      const 提示 = document.createElement("div");
      提示.id = "错误提示";
      提示.textContent = 消息;
      正文节点.appendChild(提示);
    }
  })();

  (function 顶部导航效果() {
    const 头 = document.getElementById("顶部导航");
    function 检查() {
      if (window.scrollY > 8) 头.classList.add("已滚动");
      else 头.classList.remove("已滚动");
    }
    检查();
    window.addEventListener("scroll", 检查, { passive: true });
  })();
</script>

</body>
</html>
